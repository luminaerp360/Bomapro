<aside
  class="fixed left-0 top-0 h-full bg-white dark:bg-slate-900 border-r border-gray-200/80 dark:border-slate-800 z-40 transition-all duration-300 flex flex-col select-none shadow-sm"
  [class.w-64]="!collapsed || isMobile"
  [class.w-16]="collapsed && !isMobile"
  [class.-translate-x-full]="isMobile && mobileHidden"
  [class.translate-x-0]="!isMobile || !mobileHidden"
>
  <!-- Top Brand Header -->
  <div class="flex items-center justify-between h-16 px-3.5 border-b border-gray-100 dark:border-slate-800/80">
    <a routerLink="/dashboard" class="flex items-center gap-2.5 min-w-0" (click)="navigate.emit()">
      <div
        class="w-9 h-9 rounded-xl flex items-center justify-center flex-shrink-0 shadow-sm transition-transform duration-200 hover:scale-105"
        [style.background-color]="themeService.accent"
      >
        <i class="fas fa-building-Flag fa-house-chimney text-white text-sm"></i>
      </div>
      <div *ngIf="!collapsed || isMobile" class="min-w-0 leading-tight">
        <div class="flex items-center gap-1.5">
          <span class="text-base font-extrabold tracking-tight text-gray-900 dark:text-white">Bomapro</span>
          <span class="text-[10px] font-semibold px-1.5 py-0.5 rounded bg-emerald-50 text-emerald-600 dark:bg-emerald-950/60 dark:text-emerald-400">
            ERP
          </span>
        </div>
        <p class="text-[11px] text-gray-400 dark:text-slate-400 truncate">Property Management</p>
      </div>
    </a>

    <!-- Desktop Collapse Button -->
    <button
      *ngIf="!isMobile && !collapsed"
      (click)="toggle.emit()"
      title="Collapse sidebar"
      class="w-7 h-7 rounded-lg flex items-center justify-center text-gray-400 hover:text-gray-700 dark:text-slate-400 dark:hover:text-slate-200 hover:bg-gray-100 dark:hover:bg-slate-800 transition-colors"
    >
      <i class="fas fa-angles-left text-xs"></i>
    </button>
  </div>

  <!-- Quick Menu Filter / Search (Expanded Mode) -->
  <div *ngIf="!collapsed || isMobile" class="px-3 pt-2.5 pb-1">
    <div class="relative">
      <i class="fas fa-magnifying-glass absolute left-2.5 top-1/2 -translate-y-1/2 text-[11px] text-gray-400 dark:text-slate-500"></i>
      <input
        type="text"
        [(ngModel)]="searchQuery"
        (ngModelChange)="onSearchChange()"
        placeholder="Filter menu..."
        class="w-full pl-7 pr-6 py-1.5 text-xs rounded-lg bg-gray-100/80 dark:bg-slate-800/80 border border-transparent focus:border-gray-300 dark:focus:border-slate-700 focus:bg-white dark:focus:bg-slate-800 text-gray-700 dark:text-slate-200 placeholder-gray-400 dark:placeholder-slate-500 outline-none transition-all"
      />
      <button
        *ngIf="searchQuery"
        (click)="clearSearch()"
        class="absolute right-2 top-1/2 -translate-y-1/2 text-gray-400 hover:text-gray-600 dark:hover:text-slate-300"
      >
        <i class="fas fa-xmark text-xs"></i>
      </button>
    </div>
  </div>

  <!-- Categorized Navigation -->
  <nav class="flex-1 py-2 px-2.5 space-y-4 overflow-y-auto sidebar-scroll">
    <div *ngFor="let section of groupedSections; trackBy: trackBySection" class="space-y-1">
      <!-- Section Header (Expanded Mode) -->
      <button
        *ngIf="!collapsed || isMobile"
        type="button"
        (click)="toggleSection(section.id)"
        class="w-full flex items-center justify-between px-2 py-1 text-[10px] font-bold uppercase tracking-wider text-gray-400 dark:text-slate-500 hover:text-gray-600 dark:hover:text-slate-300 transition-colors"
      >
        <span>{{ section.title }}</span>
        <i
          class="fas text-[9px] transition-transform duration-200"
          [ngClass]="isSectionCollapsed(section.id) ? 'fa-chevron-right' : 'fa-chevron-down'"
        ></i>
      </button>

      <!-- Divider in Collapsed Mode -->
      <div
        *ngIf="collapsed && !isMobile"
        class="mx-auto my-1.5 w-6 border-t border-gray-100 dark:border-slate-800"
      ></div>

      <!-- Section Items -->
      <div *ngIf="!isSectionCollapsed(section.id) || (collapsed && !isMobile)" class="space-y-0.5">
        <a
          *ngFor="let item of section.items; trackBy: trackByItem"
          [routerLink]="item.route"
          (click)="navigate.emit()"
          class="group relative flex items-center gap-3 px-2.5 py-2 rounded-xl text-xs font-medium transition-all duration-150 cursor-pointer"
          [ngClass]="
            isActive(item.route)
              ? 'text-white shadow-sm'
              : 'text-gray-600 dark:text-slate-400 hover:bg-gray-100/90 dark:hover:bg-slate-800/70 hover:text-gray-900 dark:hover:text-slate-100'
          "
          [class.justify-center]="collapsed && !isMobile"
          [style.background-color]="isActive(item.route) ? themeService.accent : 'transparent'"
        >
          <!-- Icon -->
          <div class="relative flex items-center justify-center w-5 h-5 flex-shrink-0">
            <i
              [class]="item.icon"
              class="text-sm transition-transform duration-150 group-hover:scale-110"
            ></i>
            <!-- Collapsed Badge Dot -->
            <span
              *ngIf="collapsed && !isMobile && getBadgeCount(item) > 0"
              class="absolute -top-1 -right-1 w-2 h-2 rounded-full ring-2 ring-white dark:ring-slate-900"
              [ngClass]="{
                'bg-rose-500': item.badgeType === 'danger',
                'bg-amber-500': item.badgeType === 'warning',
                'bg-blue-500': item.badgeType === 'info' || !item.badgeType
              }"
            ></span>
          </div>

          <!-- Label & Live Badge (Expanded Mode) -->
          <span *ngIf="!collapsed || isMobile" class="truncate flex-1">{{ item.label }}</span>

          <span
            *ngIf="(!collapsed || isMobile) && getBadgeCount(item) > 0"
            class="px-1.5 py-0.5 text-[10px] font-bold rounded-full leading-none"
            [ngClass]="getBadgeClasses(item)"
          >
            {{ getBadgeCount(item) }}
          </span>

          <!-- Floating Tooltip (Collapsed Desktop Mode) -->
          <div
            *ngIf="collapsed && !isMobile"
            class="pointer-events-none fixed left-14 ml-2 px-2.5 py-1.5 rounded-lg bg-gray-900 dark:bg-slate-700 text-white text-xs font-medium whitespace-nowrap opacity-0 group-hover:opacity-100 transition-opacity duration-150 shadow-lg z-50 flex items-center gap-2"
          >
            <span>{{ item.label }}</span>
            <span
              *ngIf="getBadgeCount(item) > 0"
              class="px-1.5 py-0.5 text-[10px] rounded-full bg-white/20 text-white font-bold"
            >
              {{ getBadgeCount(item) }}
            </span>
          </div>
        </a>
      </div>
    </div>
  </nav>

  <!-- Bottom User Profile & Collapse Footer -->
  <div class="p-2.5 border-t border-gray-100 dark:border-slate-800/80 bg-gray-50/50 dark:bg-slate-900/50 space-y-2">
    <!-- User Profile Card -->
    <div
      *ngIf="currentUser"
      class="flex items-center gap-2.5 p-1.5 rounded-xl"
      [class.justify-center]="collapsed && !isMobile"
    >
      <div
        class="w-8 h-8 rounded-full flex items-center justify-center text-white text-xs font-bold flex-shrink-0 shadow-sm"
        [style.background-color]="themeService.accent"
        [title]="currentUser.name + ' (' + formatRole(currentUser.role) + ')'"
      >
        {{ currentUser.name.charAt(0).toUpperCase() }}
      </div>
      <div *ngIf="!collapsed || isMobile" class="min-w-0 flex-1">
        <p class="text-xs font-semibold text-gray-800 dark:text-slate-100 truncate">{{ currentUser.name }}</p>
        <p class="text-[10px] text-gray-500 dark:text-slate-400 truncate">{{ formatRole(currentUser.role) }}</p>
      </div>
      <button
        *ngIf="!collapsed || isMobile"
        (click)="logout()"
        title="Sign out"
        class="w-7 h-7 rounded-lg flex items-center justify-center text-gray-400 hover:text-rose-600 dark:hover:text-rose-400 hover:bg-rose-50 dark:hover:bg-rose-950/40 transition-colors flex-shrink-0"
      >
        <i class="fas fa-right-from-bracket text-xs"></i>
      </button>
    </div>

    <!-- Expand Button When Collapsed (Desktop Only) -->
    <button
      *ngIf="collapsed && !isMobile"
      (click)="toggle.emit()"
      title="Expand sidebar"
      class="w-full flex items-center justify-center py-1.5 rounded-lg text-xs text-gray-500 dark:text-slate-400 hover:bg-gray-100 dark:hover:bg-slate-800 transition-colors"
    >
      <i class="fas fa-angles-right"></i>
    </button>
  </div>
</aside>
